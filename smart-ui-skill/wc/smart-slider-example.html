<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slider 滑块 - WC Demo</title>
  <script src="./slider.js?v=ty-slider-8"></script>
  <style>
    :root {
      --app-B1: #fff;
      --app-B1-N1: #1f2329;
      --app-B3: #f6f7fb;
      --app-B4: #fff;
      --app-B4-N1: #1f2329;
      --app-B4-N3: #646566;
      --app-B4-N7: #ebedf0;
      --app-M1: #3678e3;
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--app-B3);
      color: var(--app-B1-N1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    .demo-page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 24px 16px 48px
    }

    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px
    }

    .demo-header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px
    }

    .demo-header a {
      color: #3678e3;
      text-decoration: none;
      font-size: 14px
    }

    .demo-block {
      margin: 0 0 24px
    }

    .demo-block h2 {
      margin: 0 0 12px 16px;
      color: #646566;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px
    }

    .demo-block__content {
      min-width: 0
    }

    .demo-block--padding .demo-block__content {
      padding: 0 16px
    }

    .demo-block__content>smart-cell,
    .demo-block__content>smart-button,
    .demo-block__content>smart-popup,
    .demo-block__content>smart-overlay,
    .demo-block__content>smart-progress,
    .demo-block__content>smart-notice-bar {
      margin-bottom: 12px
    }

    .row,
    .line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px
    }

    .contain {
      width: 100%
    }

    img {
      max-width: 100%
    }

    [hidden] {
      display: none !important
    }

    .slider {
      margin: 0 15px 30px;
    }

    .custom-button {
      width: 26px;
      color: #fff;
      font-size: 10px;
      line-height: 18px;
      text-align: center;
      border-radius: 100px;
      background-color: #ee0a24;
    }
  </style>
  <link rel="stylesheet" href="./smart-common.css">
</head>

<body>
  <main class="demo-page">
    <header class="demo-header">
      <h1>Slider 滑块</h1><a href="./home.html">Home</a>
    </header>
    <div style="padding: 0 24px;">
      <section class="demo-block">
        <h2>普通滑动条</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider1" track-style="height:4px" bar-style="height:4px" value="50"
            data-bind-value="currentValue"></smart-slider>
        </div>
      </section>

      <section class="demo-block">
        <h2>间隔滑动条</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider2" track-style="height:8px" bar-style="height:8px"
            thumb-style="width:18px;height:18px;" step-style="width:4px;height:4px;"
            active-step-style="background:#fff;" is-show-ticks step="10" min="0" max="100" value="50"
            data-bind-value="currentValue"></smart-slider>
        </div>
      </section>

      <section class="demo-block">
        <h2>间隔滑动条</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider3" track-style="height:40px;border-radius:16px;"
            bar-style="height:40px;border-radius:16px;" thumb-style="width:18px;height:18px;"
            step-style="width:4px;height:12px;border-radius:4px;"
            active-step-style="width:4px;height:12px;border-radius:4px;background:#fff;" hide-thumb-button is-show-ticks
            step="30" min="0" max="90" value="50" data-bind-value="currentValue"></smart-slider>
        </div>
      </section>

      <section class="demo-block">
        <h2>拖动滑动条</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider4" parcel parcel-margin="2" track-style="height:26px;border-radius:13px;"
            bar-style="height:22px;border-radius:13px;"
            thumb-style="width:20px;height:20px;background:#fff;border-radius:50%;" parcel-thumb-width="18"
            parcel-thumb-height="18" value="50" data-bind-value="currentValue"></smart-slider>
        </div>
      </section>

      <section class="demo-block">
        <h2>拖动滑动条</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider5" track-style="height:45px;border-radius:8px;"
            bar-style="height:45px;border-radius:8px;"
            thumb-style="width:15px;height:50px;background:#BBC5D4;border:2px solid #FFFFFF;box-shadow:0px 0px 2px 0px rgba(0, 0, 0, 0.5);border-radius:2px;"
            value="50" data-bind-value="currentValue"></smart-slider>
        </div>
      </section>

      <section class="demo-block">
        <h2>拖动滑动条</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider6" parcel parcel-margin="2" track-style="height:26px;border-radius:5px;"
            bar-style="height:22px;border-radius:5px;" parcel-thumb-width="3" parcel-thumb-height="16"
            thumb-style="width:5px;height:16px;background:#fff;" value="50"
            data-bind-value="currentValue"></smart-slider>
        </div>
      </section>

      <section class="demo-block">
        <h2>竖向</h2>
        <div class="demo-block__content">
          <smart-slider instance-id="slider7" is-vertical step="1" min="0" max="100" parcel parcel-margin="2"
            use-parcel-padding="false" parcel-thumb-width="12" parcel-thumb-height="2"
            thumb-style="width: 12px;height:2px;border-radius:2px;background: #FFFFFF;"
            track-style="width:48px;height:203px;border-radius:10px;background: var(--app-B4-N7,rgba(0,0,0,.1));"
            bar-style="width:48px;height:114px;background:#1989FA;"></smart-slider>
        </div>
      </section>
    </div>

  </main>
  <script>window.__demoState = {
      "currentValue": 50,
      "range": [
        10,
        40
      ]
    }; window.__handlerMaps = {
      "toggle": {},
      "setTrue": {},
      "setFalse": {}
    }; function __evalDemo(expr) { try { return Function('state', 'computed', 'with(state){return (' + expr + ')}')(window.__demoState, { pad: n => String(n).padStart(2, '0'), formatDate(v) { const d = new Date(Array.isArray(v) ? v[0] : v); return Number.isNaN(d.getTime()) ? '' : d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()) }, formatFullDate(v) { return this.formatDate(v) }, formatRange(v) { return Array.isArray(v) ? v.map(x => this.formatDate(x)).filter(Boolean).join(' ~ ') : this.formatDate(v) } }) } catch (e) { return '' } } function __attrValue(v) { return v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v) } function __applyBindings() { document.querySelectorAll('*').forEach(el => { Array.from(el.attributes).forEach(a => { if (!a.name.startsWith('data-bind-')) return; const real = a.name.slice(10), v = __evalDemo(a.value); if (typeof v === 'boolean') el.setAttribute(real, v ? '' : 'false'); else if (v == null || v === '') el.removeAttribute(real); else el.setAttribute(real, __attrValue(v)); const prop = real.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); try { if (prop in el) el[prop] = v } catch (e) { } }) }) } function __path(p) { if (!p) return null; const parts = String(p).split('.'); let o = window.__demoState; for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]] } return [o, parts[parts.length - 1]] } function __set(p, v) { const r = __path(p); if (!r) return false; r[0][r[1]] = v; __applyBindings(); return true } function __toggle(p) { const r = __path(p); if (!r) return false; r[0][r[1]] = !r[0][r[1]]; __applyBindings(); return true } function __handle(h, e, el) { const m = window.__handlerMaps || { toggle: {}, setTrue: {}, setFalse: {} }; if (m.toggle && m.toggle[h]) return __toggle(m.toggle[h]); if (h === 'onClick' && el.dataset && el.dataset.stateKey) return __set(el.dataset.stateKey + '.show', true); if (h === 'onClose' && el.dataset && el.dataset.stateKey) return __set(el.dataset.stateKey + '.show', false); if (m.setTrue && m.setTrue[h]) return __set(m.setTrue[h], true); if (m.setFalse && m.setFalse[h]) return __set(m.setFalse[h], false); if (/toggle|show|open|close/i.test(h)) { const s = el.closest('.demo-block') || document, t = s.querySelector('[data-bind-show]') || el.closest('[data-bind-show]'); if (t) return __toggle(t.getAttribute('data-bind-show')) } if (/confirm|cancel|close/i.test(h)) { const t = el.closest('[data-bind-show]') || el; if (t && t.getAttribute('data-bind-show')) return __set(t.getAttribute('data-bind-show'), false) } if (/change|input/i.test(h) && e && e.detail != null) { const t = el.getAttribute('data-bind-value') || el.getAttribute('data-bind-active-index'); if (t) return __set(t, e.detail && e.detail.value !== undefined ? e.detail.value : e.detail) } return false } document.addEventListener('DOMContentLoaded', () => { __applyBindings(); document.querySelectorAll('*').forEach(el => Array.from(el.attributes).forEach(a => { if (a.name.startsWith('data-on-')) el.addEventListener(a.name.slice(8), e => __handle(a.value, e, el)) })) });</script>
</body>

</html>
