<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell 单元格 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f6f7fb;
      color: #1f2329;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .demo-page {
      width: min(100%, 596px);
      min-height: 100vh;
      padding: 36px 0 40px;
    }

    .demo-block {
      margin: 0 0 28px;
    }

    .demo-block h2 {
      margin: 0 0 12px;
      padding: 0 30px;
      color: #5f6368;
      font-size: 22px;
      font-weight: 600;
      line-height: 30px;
    }

    .demo-block h2::after {
      content: "(点击聚焦文档)";
      margin-left: 2px;
      color: #8a8f99;
      font-size: 18px;
      font-weight: 400;
    }

    .title {
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }

    .cell-icon {
      margin-right: 4px;
    }

    .demo-home-link {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #3678e3;
      font-size: 14px;
      font-weight: 500;
      line-height: 34px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(31, 35, 41, 0.12);
      backdrop-filter: blur(10px);
    }
  </style>
  <link rel="stylesheet" href="./smart-common.css">
</head>
<body>
  <a class="demo-home-link" href="./home.html" aria-label="返回 Home">Home</a>
  <main class="demo-page">
    <section class="demo-block">
      <h2>基础用法</h2>
      <smart-cell-group>
        <smart-cell title="Cell 单元格" value="内容" is-link></smart-cell>
        <smart-cell title="Cell 单元格" value="内容" label="描述信息" is-link></smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>卡片风格</h2>
      <smart-cell-group inset inset-border-radius="12">
        <smart-cell title="Cell 单元格" value="内容" is-link></smart-cell>
        <smart-cell title="Cell 单元格" value="内容" label="描述信息" is-link></smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>展示图标</h2>
      <smart-cell-group>
        <smart-cell title="Cell 单元格" value="内容" data-demo-icon="sun" is-link></smart-cell>
        <smart-cell title="自定义 Icon" value="内容" is-link>
          <smart-icon class="cell-icon" slot="icon" data-demo-icon="sun" size="24px" color="#3678E3"></smart-icon>
        </smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>其他展示</h2>
      <smart-cell-group>
        <smart-cell title="Title" value="Label"></smart-cell>
        <smart-cell title="Title" is-link></smart-cell>
        <smart-cell title="Title">
          <smart-stepper value="1" step="0.1"></smart-stepper>
        </smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>页面跳转</h2>
      <smart-cell-group>
        <smart-cell title="URL重定向(navigateTo)" is-link url="/pages/dashboard/index"></smart-cell>
        <smart-cell title="URL重定向(redirectTo)" is-link url="/pages/dashboard/index" link-type="redirectTo"></smart-cell>
        <smart-cell title="打开H5容器(openInnerH5)" is-link bind:click="openH5"></smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>分组标题</h2>
      <smart-cell-group title="分组 1">
        <smart-cell title="Cell 单元格" is-link></smart-cell>
      </smart-cell-group>
      <smart-cell-group title="分组 2">
        <smart-cell title="Cell 单元格" is-link></smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>其他类型</h2>
      <smart-cell-group>
        <smart-cell title="Title">
          <smart-switch checked="true" size="24px"></smart-switch>
        </smart-cell>
        <smart-cell title="Title">
          <smart-icon data-demo-icon="check" color="#3678E3" size="28px"></smart-icon>
        </smart-cell>
        <smart-cell title="Title">
          <smart-checkbox value="false" shape="square"></smart-checkbox>
        </smart-cell>
        <smart-cell title="Title">
          <smart-checkbox value="false"></smart-checkbox>
        </smart-cell>
        <smart-cell title="Title" label="Bedroom" is-link>
          <smart-icon
            class="cell-icon"
            slot="icon"
            name="https://static1.tuyacn.com/static/tuya-miniapp-doc/_next/static/images/logo-small.png"
            size="50px"
          ></smart-icon>
        </smart-cell>
      </smart-cell-group>
    </section>

    <section class="demo-block">
      <h2>使用插槽</h2>
      <smart-cell-group>
        <smart-cell value="内容" data-demo-icon="sun" is-link>
          <div slot="title">
            <span class="title">Cell 单元格</span>
            <smart-tag type="danger">Tag 标记</smart-tag>
          </div>
        </smart-cell>
        <smart-cell title="Cell 单元格">
          <smart-icon slot="right-icon" data-demo-icon="sun"></smart-icon>
        </smart-cell>
      </smart-cell-group>
    </section>
  </main>

  <script>
    const svgIcon = source =>
      `data:image/svg+xml,${encodeURIComponent(source).replace(/'/g, "%27")}`;
    const icons = {
      sun: svgIcon("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='none' stroke='#3678E3' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='4' fill='#3678E3' stroke='#3678E3'/><path d='M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42'/></g></svg>"),
      check: svgIcon("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='#3678E3' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' d='M5 12.5l4.2 4.2L19.5 6.5'/></svg>")
    };

    document.querySelectorAll("[data-demo-icon]").forEach((el) => {
      const icon = icons[el.dataset.demoIcon];
      if (!icon) return;
      if (el.tagName.toLowerCase() === "smart-cell") {
        el.setAttribute("icon", icon);
      } else {
        el.setAttribute("name", icon);
      }
    });

    function openH5() {
      window.open("https://www.tuya.com", "_blank", "noopener");
    }
  </script>
</body>
</html>
