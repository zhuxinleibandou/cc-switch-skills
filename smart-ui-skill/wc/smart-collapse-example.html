<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collapse 折叠面板 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <link rel="stylesheet" href="./smart-common.css">
  <style>
    :root {
      --app-B1-N1: #1f2329;
      --app-B3: #f6f7fb;
      --app-B6: #fff;
      --app-B6-N7: #ebedf0;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--app-B3);
      color: var(--app-B1-N1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .demo-page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .demo-header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
    }

    .demo-header a {
      color: #3678e3;
      font-size: 14px;
      text-decoration: none;
    }

    .demo-block { margin-bottom: 24px; }

    .demo-block h2 {
      margin: 0 0 12px 16px;
      color: #646566;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }

    .custom-title {
      display: inline-flex;
      align-items: center;
    }

    .smart-icon-question {
      display: inline-flex;
      width: 15px;
      height: 15px;
      align-items: center;
      justify-content: center;
      margin-left: 5px;
      border: 1px solid currentColor;
      border-radius: 50%;
      color: #1989fa;
      font-size: 11px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="demo-page">
    <header class="demo-header">
      <h1>Collapse 折叠面板</h1>
      <a href="./home.html">Home</a>
    </header>

    <section class="demo-block">
      <h2>基础用法</h2>
      <smart-collapse value="[0]" bind:change="onCollapseChange">
        <smart-collapse-item title="标题1">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
        <smart-collapse-item title="标题2">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
        <smart-collapse-item title="标题3" disabled>代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
      </smart-collapse>
    </section>

    <section class="demo-block">
      <h2>手风琴</h2>
      <smart-collapse value="0" accordion bind:change="onCollapseChange">
        <smart-collapse-item title="标题1">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
        <smart-collapse-item title="标题2">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
        <smart-collapse-item title="标题3">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
      </smart-collapse>
    </section>

    <section class="demo-block">
      <h2>事件监听</h2>
      <smart-collapse id="event-collapse" value="[]" bind:change="onCollapseChange" bind:open="onCollapseOpen" bind:close="onCollapseClose">
        <smart-collapse-item title="标题1">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
        <smart-collapse-item title="标题2">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
        <smart-collapse-item title="标题3">代码是写出来给人看的，附带能在机器上运行</smart-collapse-item>
      </smart-collapse>
    </section>

    <section class="demo-block">
      <h2>自定义标题内容</h2>
      <smart-collapse value="[]" bind:change="onCollapseChange">
        <smart-collapse-item>
          <span slot="title" class="custom-title">
            标题1
            <span class="smart-icon-question" aria-hidden="true">?</span>
          </span>
          代码是写出来给人看的，附带能在机器上运行
        </smart-collapse-item>
        <smart-collapse-item title="标题2" value="内容" icon="shop-o">
          代码是写出来给人看的，附带能在机器上运行
        </smart-collapse-item>
      </smart-collapse>
    </section>

  </main>

  <script>
    function onCollapseChange(detail, event) {
      event.target.value = detail;
    }

    function onCollapseOpen(detail) {
      console.log(`展开: ${detail}`);
    }

    function onCollapseClose(detail) {
      console.log(`关闭: ${detail}`);
    }
  </script>
</body>
</html>
