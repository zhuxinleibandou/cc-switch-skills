<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkbox 复选框 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <style>
:root{--app-B1:#fff;--app-B1-N1:#1f2329;--app-B3:#f6f7fb;--app-B4:#fff;--app-B4-N1:#1f2329;--app-B4-N3:#646566;--app-B4-N7:#ebedf0;--app-M1:#3678e3;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--app-B3);color:var(--app-B1-N1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo-page{width:min(100%,760px);margin:0 auto;padding:24px 16px 48px}.demo-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.demo-header h1{margin:0;font-size:24px;line-height:32px}.demo-header a{color:#3678e3;text-decoration:none;font-size:14px}.demo-block{margin:0 0 24px}.demo-block h2{margin:0 0 12px 16px;color:#646566;font-size:14px;font-weight:500;line-height:20px}.demo-block__content{min-width:0}.demo-block--padding .demo-block__content{padding:0 16px}.demo-block__content>smart-cell,.demo-block__content>smart-button,.demo-block__content>smart-popup,.demo-block__content>smart-overlay,.demo-block__content>smart-progress,.demo-block__content>smart-notice-bar{margin-bottom:12px}.row,.line{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.contain{width:100%}img{max-width:100%}[hidden]{display:none!important}
.demo-checkbox-group {
  margin: 10px 0 0 20px;
}

.demo-checkbox {
  margin: 10px 0 0 20px;
}

.demo-checkbox-inline {
  margin: 10px 0 0 20px;
  display: inline-block !important;
}

.value-class {
  flex: none !important;
}

  width: 20px;

  <link rel="stylesheet" href="./smart-common.css">
</head>
<body>
  <main class="demo-page">
    <header class="demo-header"><h1>Checkbox 复选框</h1><a href="./home.html">Home</a></header>
<section class="demo-block"><h2>基础用法</h2><div class="demo-block__content">
  <smart-checkbox
    value="true" data-bind-value="checkbox1"
    data-key="checkbox1"
    custom-class="demo-checkbox-inline"
    bind:change="onChange"
  ></smart-checkbox>
  <smart-checkbox
    value="false" data-bind-value="checkbox1 ? false : true"
    data-key="checkbox1"
    custom-class="demo-checkbox-inline"
    bind:change="onChange2"
  ></smart-checkbox>
</div></section>

<section class="demo-block"><h2>禁用状态</h2><div class="demo-block__content">
  <smart-checkbox
    disabled
    value="false" data-bind-value="false"
    custom-class="demo-checkbox-inline"
  ></smart-checkbox>
  <smart-checkbox
    disabled
    value="true" data-bind-value="true"
    custom-class="demo-checkbox-inline"
  ></smart-checkbox>
</div></section>

<section class="demo-block"><h2>自定义形状</h2><div class="demo-block__content">
  <smart-checkbox
    value="true" data-bind-value="checkboxShape"
    data-key="checkboxShape"
    shape="square"
    custom-class="demo-checkbox-inline"
    bind:change="onChange"
  ></smart-checkbox>
  <smart-checkbox
    value="false" data-bind-value="checkboxShape ? false : true"
    data-key="checkboxShape"
    shape="square"
    custom-class="demo-checkbox-inline"
    bind:change="onChange2"
  ></smart-checkbox>
</div></section>

<section class="demo-block"><h2>自定义颜色</h2><div class="demo-block__content">
  <smart-checkbox
    value="true" data-bind-value="checkbox2"
    data-key="checkbox2"
    checked-color="#10D0D0"
    custom-class="demo-checkbox-inline"
    bind:change="onChange"
  ></smart-checkbox>
  <smart-checkbox
    value="false" data-bind-value="checkbox2 ? false : true"
    data-key="checkbox2"
    checked-color="#10D0D0"
    custom-class="demo-checkbox-inline"
    bind:change="onChange2"
  ></smart-checkbox>
</div></section>

<section class="demo-block"><h2>自定义大小</h2><div class="demo-block__content">
  <smart-checkbox
    icon-size="28px"
    value="true" data-bind-value="checkboxSize"
    data-key="checkboxSize"
    custom-class="demo-checkbox-inline"
    bind:change="onChange"
  ></smart-checkbox>
  <smart-checkbox
    icon-size="28px"
    value="false" data-bind-value="checkboxSize ? false : true"
    data-key="checkboxSize"
    custom-class="demo-checkbox-inline"
    bind:change="onChange2"
  ></smart-checkbox>
</div></section>

<section class="demo-block"><h2>展示文本</h2><div class="demo-block__content">
  <smart-checkbox
    value="true" data-bind-value="checkbox1"
    data-key="checkbox1"
    custom-class="demo-checkbox"
    bind:change="onChange"
  >
  自定义文本
  </smart-checkbox>
</div></section>

<section class="demo-block"><h2>自定义图标</h2><div class="demo-block__content">
  <smart-checkbox
    use-icon-slot
    value="true" data-bind-value="checkbox3"
    data-key="checkbox3"
    custom-class="demo-checkbox"
    bind:change="onChange"
  >
    自定义图标
    <img
      slot="icon"
      class="icon"
      mode="widthFix"
      src="https://images.tuyacn.com/content-platform/hestia/1730877912e76cbdb7563.png"
    />
  </smart-checkbox>
</div></section>

<section class="demo-block"><h2>禁用文本点击</h2><div class="demo-block__content">
  <smart-checkbox
    label-disabled
    value="true" data-bind-value="checkboxLabel"
    data-key="checkboxLabel"
    custom-class="demo-checkbox"
    bind:change="onChange"
  >
    Checkbox 复选框
  </smart-checkbox>
</div></section>

<section class="demo-block"><h2>复选框组</h2><div class="demo-block__content">
  <smart-checkbox-group value="[&quot;a&quot;,&quot;b&quot;]" data-bind-value="result" data-key="result" bind:change="onChange">
    <smart-checkbox
     
     
      name="a"
      data-name="a"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 a
    </smart-checkbox><smart-checkbox
     
     
      name="b"
      data-name="b"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 b
    </smart-checkbox><smart-checkbox
     
     
      name="c"
      data-name="c"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 c
    </smart-checkbox>
  </smart-checkbox-group>
</div></section>

<section class="demo-block"><h2>水平排列</h2><div class="demo-block__content">
  <smart-checkbox-group direction="horizontal" value="[]" data-bind-value="result4" data-key="result4" bind:change="onChange">
    <smart-checkbox
     
     
      name="a"
      data-name="a"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 a
    </smart-checkbox><smart-checkbox
     
     
      name="b"
      data-name="b"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 b
    </smart-checkbox><smart-checkbox
     
     
      name="c"
      data-name="c"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 c
    </smart-checkbox>
  </smart-checkbox-group>
</div></section>

<section class="demo-block"><h2>限制最大可选数</h2><div class="demo-block__content">
  <smart-checkbox-group value="[]" data-bind-value="result2" data-key="result2" max="2" bind:change="onChange">
    <smart-checkbox
     
     
      name="a"
      data-name="a"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 a
    </smart-checkbox><smart-checkbox
     
     
      name="b"
      data-name="b"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 b
    </smart-checkbox><smart-checkbox
     
     
      name="c"
      data-name="c"
      custom-class="demo-checkbox"
    >
      Checkbox 复选框 c
    </smart-checkbox>
  </smart-checkbox-group>
</div></section>

<section class="demo-block"><h2>搭配单元格组件使用</h2><div class="demo-block__content">
  <smart-checkbox-group value="[]" data-bind-value="result3" data-key="result3" bind:change="onChange">
    <smart-cell-group >
      <smart-cell
       
       
        title="Checkbox 复选框 a"
        value-class="value-class"
        clickable
        data-index="0"
        bind:click="toggle"
      >
        <smart-checkbox bind:click="noop" class="checkboxes-0" name="a" data-name="a" ></smart-checkbox>
      </smart-cell><smart-cell
       
       
        title="Checkbox 复选框 b"
        value-class="value-class"
        clickable
        data-index="1"
        bind:click="toggle"
      >
        <smart-checkbox bind:click="noop" class="checkboxes-1" name="b" data-name="b" ></smart-checkbox>
      </smart-cell><smart-cell
       
       
        title="Checkbox 复选框 c"
        value-class="value-class"
        clickable
        data-index="2"
        bind:click="toggle"
      >
        <smart-checkbox bind:click="noop" class="checkboxes-2" name="c" data-name="c" ></smart-checkbox>
      </smart-cell>
    </smart-cell-group>
  </smart-checkbox-group>
</div></section>

  </main>
<script>window.__demoState={
  "checkbox1": true,
  "checkbox2": true,
  "checkbox3": true,
  "checkboxLabel": true,
  "checkboxSize": true,
  "checkboxShape": true,
  "list": [
    "a",
    "b",
    "c"
  ],
  "result": [
    "a",
    "b"
  ],
  "result2": [],
  "result3": [],
  "result4": [],
  "activeIcon": "https://images.tuyacn.com/content-platform/hestia/1730877912e76cbdb7563.png",
  "inactiveIcon": ""
};window.__handlerMaps={
  "toggle": {},
  "setTrue": {},
  "setFalse": {}
};function __evalDemo(expr){try{return Function('state','computed','with(state){return ('+expr+')}')(window.__demoState,{pad:n=>String(n).padStart(2,'0'),formatDate(v){const d=new Date(Array.isArray(v)?v[0]:v);return Number.isNaN(d.getTime())?'':d.getFullYear()+'-'+this.pad(d.getMonth()+1)+'-'+this.pad(d.getDate())},formatFullDate(v){return this.formatDate(v)},formatRange(v){return Array.isArray(v)?v.map(x=>this.formatDate(x)).filter(Boolean).join(' ~ '):this.formatDate(v)}})}catch(e){return''}}function __attrValue(v){return v==null?'':typeof v==='object'?JSON.stringify(v):String(v)}function __applyBindings(){document.querySelectorAll('*').forEach(el=>{Array.from(el.attributes).forEach(a=>{if(!a.name.startsWith('data-bind-'))return;const real=a.name.slice(10),v=__evalDemo(a.value); if(typeof v==='boolean')el.setAttribute(real,String(v)); else if(v==null||v==='')el.removeAttribute(real); else el.setAttribute(real,__attrValue(v)); if(typeof v==='function'||Array.isArray(v)||(v!=null&&Object.getPrototypeOf(v)===Object.prototype)){const prop=real.replace(/-([a-z])/g,(_,c)=>c.toUpperCase());try{if(prop in el)el[prop]=v}catch(e){}}})})}function __path(p){if(!p)return null;const parts=String(p).split('.');let o=window.__demoState;for(let i=0;i<parts.length-1;i++){if(!o[parts[i]])o[parts[i]]={};o=o[parts[i]]}return [o,parts[parts.length-1]]}function __set(p,v){const r=__path(p);if(!r)return false;r[0][r[1]]=v;__applyBindings();return true}function __toggle(p){const r=__path(p);if(!r)return false;r[0][r[1]]=!r[0][r[1]];__applyBindings();return true}function __handle(h,e,el){const m=window.__handlerMaps||{toggle:{},setTrue:{},setFalse:{}};if(m.toggle&&m.toggle[h])return __toggle(m.toggle[h]);if(h==='onClick'&&el.dataset&&el.dataset.stateKey)return __set(el.dataset.stateKey+'.show',true);if(h==='onClose'&&el.dataset&&el.dataset.stateKey)return __set(el.dataset.stateKey+'.show',false);if(m.setTrue&&m.setTrue[h])return __set(m.setTrue[h],true);if(m.setFalse&&m.setFalse[h])return __set(m.setFalse[h],false);if(/toggle|show|open|close/i.test(h)){const s=el.closest('.demo-block')||document,t=s.querySelector('[data-bind-show]')||el.closest('[data-bind-show]');if(t)return __toggle(t.getAttribute('data-bind-show'))}if(/confirm|cancel|close/i.test(h)){const t=el.closest('[data-bind-show]')||el;if(t&&t.getAttribute('data-bind-show'))return __set(t.getAttribute('data-bind-show'),false)}if(/change|input/i.test(h)&&e&&e.detail!=null){const t=el.getAttribute('data-bind-value')||el.getAttribute('data-bind-checked')||el.getAttribute('data-bind-active-index');if(t)return __set(t,e.detail&&e.detail.value!==undefined?e.detail.value:e.detail)}return false}document.addEventListener('DOMContentLoaded', __applyBindings);</script>
<script>
(function(){
  const baseHandle = window.__handle;
  window.__handle = function(handlerName, event, element) {
    const detail = event && event.detail;
    const key = element && element.dataset && element.dataset.key;
    if (handlerName === 'onChange' && key) {
      window.__demoState[key] = detail;
      __applyBindings();
      return true;
    }
    if (handlerName === 'onChange2' && key) {
      window.__demoState[key] = !detail;
      __applyBindings();
      return true;
    }
    if (handlerName === 'toggle') {
      const index = element && element.dataset && element.dataset.index;
      const checkbox = element && element.querySelector && element.querySelector('.checkboxes-' + index);
      if (checkbox && typeof checkbox.toggle === 'function') checkbox.toggle();
      return true;
    }
    if (handlerName === 'noop') return true;
    return baseHandle(handlerName, event, element);
  };
})();
</script>
</body>
</html>
