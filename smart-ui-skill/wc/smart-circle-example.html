<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circle 环形进度条 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <link rel="stylesheet" href="./smart-common.css">
  <style>
    :root {
      --app-B1-N1: #1f2329;
      --app-B3: #f6f7fb;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--app-B3);
      color: var(--app-B1-N1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .demo-page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .demo-header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
    }

    .demo-header a {
      color: #3678e3;
      font-size: 14px;
      text-decoration: none;
    }

    .contain { padding: 0 24px; }

    .demo-block { margin-bottom: 24px; }

    .demo-block h2 {
      margin: 0 0 12px;
      color: #646566;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }

    smart-circle { margin: 5px 10px 20px; }

    .flex {
      display: flex;
      justify-content: space-between;
    }

    .flex smart-circle { margin-right: 0; margin-left: 0; }
  </style>
</head>
<body>
  <main class="demo-page">
    <header class="demo-header">
      <h1>Circle 环形进度条</h1>
      <a href="./home.html">Home</a>
    </header>

    <div class="contain">
      <section class="demo-block">
        <h2>基础用法</h2>
        <smart-circle percent="50" track-width="10"></smart-circle>
      </section>

      <section class="demo-block">
        <h2>缺口圆环</h2>
        <div class="flex">
          <smart-circle percent="50" mode="angle"></smart-circle>
          <smart-circle percent="50" mode="angle2"></smart-circle>
          <smart-circle percent="50" mode="angle2" angle-offset="30"></smart-circle>
        </div>
      </section>

      <section class="demo-block">
        <h2>不使用圆角</h2>
        <smart-circle percent="50" mode="angle" round="false"></smart-circle>
      </section>

      <section class="demo-block">
        <h2>自定义颜色</h2>
        <div class="flex">
          <smart-circle percent="50" mode="angle" round="false" fill-color="#DE23CB"></smart-circle>
          <smart-circle
            percent="50"
            mode="angle"
            round="false"
            fill-color-stops='{"0%":"#2361DE","50%":"#23DEB5"}'
          ></smart-circle>
        </div>
      </section>

      <section class="demo-block">
        <h2>自定义宽度</h2>
        <smart-circle percent="60" track-width="15" mode="angle" round="false"></smart-circle>
      </section>
    </div>
  </main>
</body>
</html>
