<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ActionSheet 动作面板 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <style>
:root{--app-B1:#fff;--app-B1-N1:#1f2329;--app-B3:#f6f7fb;--app-B4:#fff;--app-B4-N1:#1f2329;--app-B4-N3:#646566;--app-B4-N7:#ebedf0;--app-M1:#3678e3;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--app-B3);color:var(--app-B1-N1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo-page{width:min(100%,760px);margin:0 auto;padding:24px 16px 48px}.demo-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.demo-header h1{margin:0;font-size:24px;line-height:32px}.demo-header a{color:#3678e3;text-decoration:none;font-size:14px}.demo-block{margin:0 0 24px}.demo-block h2{margin:0 0 12px 16px;color:#646566;font-size:14px;font-weight:500;line-height:20px}.demo-block__content{min-width:0}.demo-block--padding .demo-block__content{padding:0 16px}.demo-block__content>smart-cell,.demo-block__content>smart-button,.demo-block__content>smart-popup,.demo-block__content>smart-overlay,.demo-block__content>smart-progress,.demo-block__content>smart-notice-bar{margin-bottom:12px}.row,.line{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.contain{width:100%}img{max-width:100%}[hidden]{display:none!important}
.content {
  display: flex;
  justify-content: center;
  font-size: 20px;
  padding: 76px 0;
  background: var(--app-B1, #f6f7fb);
  color: var(--app-B4-N1, #3d3d3d);
}

.content-number {
  padding: 10px 39px;
  background: var(--app-B1, #f6f7fb);
  text-align: center;
  color: var(--app-B4-N1, #000);
}

.demo-header {
  padding: 10px 39px;
}

.demo-text {
  font-size: 40px;
  font-weight: 600;
  line-height: 46px;
}

.demo-slider {
  margin: 23px 0;
  min-height: 45px;
}

.demo-custom-double-select-header {
  display: flex;
  align-items: center;
  justify-content: space-around;
}

.demo-custom-double-select-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.flex1 {
  flex: 1;
}
  </style>
  <link rel="stylesheet" href="./smart-common.css">
</head>
<body>
  <main class="demo-page">
    <header class="demo-header"><h1>ActionSheet 动作面板</h1><a href="./home.html">Home</a></header>
<section class="demo-block demo-block--padding"><h2>基础用法</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheetSelect">弹出菜单</smart-button>
  <smart-action-sheet
    title="Title"
    cancel-text="取消"
    show="false" data-bind-show="showSelect"
    actions="[{&quot;id&quot;:0,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:true},{&quot;id&quot;:1,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:2,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:3,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:4,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:5,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:6,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:7,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false}]" data-bind-actions="actionSelect"
    bind:select="onSelect"
    bind:close="toggleActionSheetSelect"
    bind:cancel="toggleActionSheetSelect"></smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>自定义选中 icon 颜色</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheetSelect2">弹出菜单</smart-button>
  <smart-action-sheet
    title="Title"
    cancel-text="取消"
    show="false" data-bind-show="showSelect2"
    actions="[{&quot;id&quot;:0,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:true},{&quot;id&quot;:1,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:2,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:3,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:4,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:5,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:6,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false},{&quot;id&quot;:7,&quot;name&quot;:&quot;Action&quot;,&quot;checked&quot;:false}]" data-bind-actions="actionSelect"
    active-color="#1989FA"
    bind:select="onSelect"
    bind:close="toggleActionSheetSelect2"
    bind:cancel="toggleActionSheetSelect2"></smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>无选中列表</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheet1">弹出菜单</smart-button>
  <smart-action-sheet
    title="Title"
    cancel-text="取消"
    show="false" data-bind-show="show1"
    actions="[{&quot;name&quot;:&quot;Action&quot;},{&quot;name&quot;:&quot;Action&quot;},{&quot;name&quot;:&quot;Action&quot;,&quot;subname&quot;:&quot;Description&quot;}]" data-bind-actions="action1"
    bind:close="toggleActionSheet1"
    bind:cancel="toggleActionSheet1"></smart-action-sheet>
</div></section>


<section class="demo-block demo-block--padding"><h2>选项状态</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheet2">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="show2"
    actions="[{&quot;name&quot;:&quot;着色选项&quot;,&quot;color&quot;:&quot;#ee0a24&quot;},{&quot;loading&quot;:true},{&quot;name&quot;:&quot;禁用选项&quot;,&quot;disabled&quot;:true}]" data-bind-actions="action2"
    bind:close="toggleActionSheet2"></smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>展示确认按钮</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheet3">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="show3"
    actions="[{&quot;name&quot;:&quot;Action&quot;},{&quot;name&quot;:&quot;Action&quot;},{&quot;name&quot;:&quot;Action&quot;,&quot;subname&quot;:&quot;Description&quot;}]" data-bind-actions="action1"
    cancel-text="取消"
    confirm-text="确认"
    bind:close="toggleActionSheet3"
    bind:cancel="toggleActionSheet3"
    bind:confirm="toggleActionSheet3"
  >
  </smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>展示描述信息</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheet4">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="show4"
    actions="[{&quot;name&quot;:&quot;Action&quot;},{&quot;name&quot;:&quot;Action&quot;},{&quot;name&quot;:&quot;Action&quot;,&quot;subname&quot;:&quot;Description&quot;}]" data-bind-actions="action1"
    description="这是一段描述信息"
    bind:close="toggleActionSheet4"
  >
  </smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>自定义</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheet5">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="show5"
    title="Title"
    cancel-text="Action"
    confirm-text="Action"
    bind:close="toggleActionSheet5"
    bind:cancel="toggleActionSheet5"
    bind:confirm="toggleActionSheet5"
  >
    <div class="content">自定义</div>
  </smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>自定义数值</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheetNumber">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="showNumber"
    title="Title"
    cancel-text="Action"
    confirm-text="Action"
    bind:close="toggleActionSheetNumber"
    bind:cancel="toggleActionSheetNumber"
    bind:confirm="toggleActionSheetNumber"
    bind:after-enter="onAfterEnter"
  >
    <div class="content-number">
      <div class="demo-header">
        <span class="demo-text">0%</span>
      </div>
      <div class="demo-slider">
        <smart-slider
          hidden
         
          trackStyle="height:45px;border-radius:8px;"
          barStyle="height:45px;border-radius:8px;"
          thumbStyle="width:15px;height:50px;background:#BBC5D4;border:2px solid #FFFFFF;box-shadow:0px 0px 2px 0px rgba(0, 0, 0, 0.5);border-radius:2px;"
          value="0" data-bind-value="currentNumber"
          bind:change="onChange"></smart-slider>
        <div style="height: 45px;" />
      </div>
    </div>
  </smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2></h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheetPicker">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="showPicker"
    title="Title"
    cancel-text="Action"
    confirm-text="Action"
    bind:close="toggleActionSheetPicker"
    bind:cancel="toggleActionSheetPicker"
    bind:confirm="onPickerConfirm"
  >
    <smart-datetime-picker
      show-toolbar="false" data-bind-show-toolbar="false"
      type="date"
      data-type="date"
      value="1514736000000" data-bind-value="currentDate"
      min-date="1514736000000" data-bind-min-date="minDate"
      bind:input="onInput"></smart-datetime-picker>
  </smart-action-sheet>
</div></section>

<section class="demo-block demo-block--padding"><h2>自定义双列选择器</h2><div class="demo-block__content">
  <smart-button type="primary" bind:click="toggleActionSheetDoubleSelector">弹出菜单</smart-button>
  <smart-action-sheet
    show="false" data-bind-show="showDoubleSelector"
    use-title-slot="true" data-bind-use-title-slot="true"
    cancel-text="Cancel"
    confirm-text="Confirm"
    bind:close="toggleActionSheetDoubleSelector"
    bind:cancel="toggleActionSheetDoubleSelector"
    bind:confirm="onDoubleSelectorConfirm"
  >
    <div slot="title" class="demo-custom-double-select-header">
      <div>Time</div>
      <div>Temp</div>
    </div>
    <div class="demo-custom-double-select-content">
      <smart-datetime-picker
        class="flex1"
        type="time"
        data-type="time"
        is-12-hour-clock
        item-height="44"
        show-toolbar="false" data-bind-show-toolbar="false"
        value="12:00" data-bind-value="current12Date"
        max-hour="23" data-bind-max-hour="maxHour"
        min-hour="0" data-bind-min-hour="minHour"
        bind:input="onCurrent12DateInput"></smart-datetime-picker>
      <smart-picker
        class="flex1"
        unit="℃"
        item-height="44"
        active-index="3" data-bind-active-index="tempColumnIdx"
        columns="[39,40,41,42,43,44,45]" data-bind-columns="tempColumns"
        bind:change="onTempColumnChange"></smart-picker>
    </div>
  </smart-action-sheet>
</div></section>

  </main>
<script>window.__demoState={
  "show1": false,
  "show2": false,
  "show3": false,
  "show4": false,
  "show5": false,
  "showSelect": false,
  "showSelect2": false,
  "showNumber": false,
  "showPicker": false,
  "showDoubleSelector": false,
  "isReady": false,
  "isA11y": false,
  "action1": [
    {
      "name": "Action"
    },
    {
      "name": "Action"
    },
    {
      "name": "Action",
      "subname": "Description"
    }
  ],
  "action2": [
    {
      "name": "着色选项",
      "color": "#ee0a24"
    },
    {
      "loading": true
    },
    {
      "name": "禁用选项",
      "disabled": true
    }
  ],
  "actionSelect": [
    {
      "id": 0,
      "name": "Action",
      "checked": true
    },
    {
      "id": 1,
      "name": "Action",
      "checked": false
    },
    {
      "id": 2,
      "name": "Action",
      "checked": false
    },
    {
      "id": 3,
      "name": "Action",
      "checked": false
    },
    {
      "id": 4,
      "name": "Action",
      "checked": false
    },
    {
      "id": 5,
      "name": "Action",
      "checked": false
    },
    {
      "id": 6,
      "name": "Action",
      "checked": false
    },
    {
      "id": 7,
      "name": "Action",
      "checked": false
    }
  ],
  "currentNumber": 0,
  "currentDate": 1514736000000,
  "currentDateStr": "2018-01-01",
  "minDate": 1514736000000,
  "current12Date": "12:00",
  "minHour": 0,
  "maxHour": 23,
  "tempColumnIdx": 3,
  "tempColumns": [
    39,
    40,
    41,
    42,
    43,
    44,
    45
  ]
};window.__handlerMaps={
  "toggle": {
    "mounted": "show1",
    "toggleActionSheet2": "show2",
    "toggleActionSheet3": "show3",
    "toggleActionSheet4": "show4",
    "toggleActionSheet5": "show5",
    "toggleActionSheet6": "show6",
    "toggleActionSheetSelect": "showSelect",
    "toggleActionSheetSelect2": "showSelect2",
    "toggleActionSheetNumber": "showNumber",
    "toggleActionSheetPicker": "showPicker",
    "toggleActionSheetDoubleSelector": "showDoubleSelector"
  },
  "setTrue": {
    "toggleActionSheetSelect": "isReady"
  },
  "setFalse": {
    "onSelect": "showPicker",
    "onDoubleSelectorConfirm": "showDoubleSelector"
  }
};function __evalDemo(expr){try{return Function('state','computed','with(state){return ('+expr+')}')(window.__demoState,{pad:n=>String(n).padStart(2,'0'),formatDate(v){const d=new Date(Array.isArray(v)?v[0]:v);return Number.isNaN(d.getTime())?'':d.getFullYear()+'-'+this.pad(d.getMonth()+1)+'-'+this.pad(d.getDate())},formatFullDate(v){return this.formatDate(v)},formatRange(v){return Array.isArray(v)?v.map(x=>this.formatDate(x)).filter(Boolean).join(' ~ '):this.formatDate(v)}})}catch(e){return''}}function __attrValue(v){return v==null?'':typeof v==='object'?JSON.stringify(v):String(v)}function __applyBindings(){document.querySelectorAll('*').forEach(el=>{Array.from(el.attributes).forEach(a=>{if(!a.name.startsWith('data-bind-'))return;const real=a.name.slice(10),v=__evalDemo(a.value); if(typeof v==='boolean')el.setAttribute(real,String(v)); else if(v==null||v==='')el.removeAttribute(real); else el.setAttribute(real,__attrValue(v)); if(typeof v==='function'||Array.isArray(v)||(v!=null&&Object.getPrototypeOf(v)===Object.prototype)){const prop=real.replace(/-([a-z])/g,(_,c)=>c.toUpperCase());try{if(prop in el)el[prop]=v}catch(e){}}})})}function __path(p){if(!p)return null;const parts=String(p).split('.');let o=window.__demoState;for(let i=0;i<parts.length-1;i++){if(!o[parts[i]])o[parts[i]]={};o=o[parts[i]]}return [o,parts[parts.length-1]]}function __set(p,v){const r=__path(p);if(!r)return false;r[0][r[1]]=v;__applyBindings();return true}function __toggle(p){const r=__path(p);if(!r)return false;r[0][r[1]]=!r[0][r[1]];__applyBindings();return true}function __handle(h,e,el){const m=window.__handlerMaps||{toggle:{},setTrue:{},setFalse:{}};if(m.toggle&&m.toggle[h])return __toggle(m.toggle[h]);if(h==='onClick'&&el.dataset&&el.dataset.stateKey)return __set(el.dataset.stateKey+'.show',true);if(h==='onClose'&&el.dataset&&el.dataset.stateKey)return __set(el.dataset.stateKey+'.show',false);if(m.setTrue&&m.setTrue[h])return __set(m.setTrue[h],true);if(m.setFalse&&m.setFalse[h])return __set(m.setFalse[h],false);if(/toggle|show|open|close/i.test(h)){const s=el.closest('.demo-block')||document,t=s.querySelector('[data-bind-show]')||el.closest('[data-bind-show]');if(t)return __toggle(t.getAttribute('data-bind-show'))}if(/confirm|cancel|close/i.test(h)){const t=el.closest('[data-bind-show]')||el;if(t&&t.getAttribute('data-bind-show'))return __set(t.getAttribute('data-bind-show'),false)}if(/change|input/i.test(h)&&e&&e.detail!=null){const t=el.getAttribute('data-bind-value')||el.getAttribute('data-bind-checked')||el.getAttribute('data-bind-active-index');if(t)return __set(t,e.detail&&e.detail.value!==undefined?e.detail.value:e.detail)}return false}document.addEventListener('DOMContentLoaded', __applyBindings);</script>
</body>
</html>
