<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divider 分割线 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <link rel="stylesheet" href="./smart-common.css">
  <style>
    :root {
      --app-B1-N1: #1f2329;
      --app-B3: #f6f7fb;
      --app-B6: #fff;
      --app-B6-N7: rgba(0, 0, 0, .1);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--app-B3);
      color: var(--app-B1-N1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .demo-page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .demo-header h1 { margin: 0; font-size: 24px; line-height: 32px; }
    .demo-header a { color: #3678e3; font-size: 14px; text-decoration: none; }
    .demo-block { margin-bottom: 24px; }
    .demo-block h2 { margin: 0 0 12px 16px; color: #646566; font-size: 14px; font-weight: 500; line-height: 20px; }
    .demo-content { padding: 1px 16px; background: #fff; }
  </style>
</head>
<body>
  <main class="demo-page">
    <header class="demo-header">
      <h1>Divider 分割线</h1>
      <a href="./home.html">Home</a>
    </header>

    <section class="demo-block">
      <h2>基础用法</h2>
      <div class="demo-content"><smart-divider></smart-divider></div>
    </section>

    <section class="demo-block">
      <h2>内容位置</h2>
      <div class="demo-content">
        <smart-divider content-position="center">文本</smart-divider>
        <smart-divider content-position="left">文本</smart-divider>
        <smart-divider content-position="right">文本</smart-divider>
      </div>
    </section>

    <section class="demo-block">
      <h2>虚线</h2>
      <div class="demo-content"><smart-divider dashed></smart-divider></div>
    </section>

    <section class="demo-block">
      <h2>自定义样式</h2>
      <div class="demo-content">
        <smart-divider content-position="center" custom-style="color:#1989fa;border-color:#1989fa;font-size:18px">文本</smart-divider>
      </div>
    </section>
  </main>
</body>
</html>
