<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transition 动画 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <style>
:root{--app-B1:#fff;--app-B1-N1:#1f2329;--app-B3:#f6f7fb;--app-B4:#fff;--app-B4-N1:#1f2329;--app-B4-N3:#646566;--app-B4-N7:#ebedf0;--app-M1:#3678e3;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--app-B3);color:var(--app-B1-N1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo-page{width:min(100%,760px);margin:0 auto;padding:24px 16px 48px}.demo-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.demo-header h1{margin:0;font-size:24px;line-height:32px}.demo-header a{color:#3678e3;text-decoration:none;font-size:14px}.demo-block{margin:0 0 24px}.demo-block h2{margin:0 0 12px 16px;color:#646566;font-size:14px;font-weight:500;line-height:20px}.demo-block__content{min-width:0}.demo-block--padding .demo-block__content{padding:0 16px}.demo-block__content>smart-cell,.demo-block__content>smart-button,.demo-block__content>smart-popup,.demo-block__content>smart-overlay,.demo-block__content>smart-progress,.demo-block__content>smart-notice-bar{margin-bottom:12px}.row,.line{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.contain{width:100%}img{max-width:100%}[hidden]{display:none!important}
.block {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 100px;
  height: 100px;
  margin: -50px 0 0 -50px;
  background-color: #1989fa;
}

.smart-enter-active-class,
.smart-leave-active-class {
  transition-property: background-color, transform;
}

.smart-enter-class,
.smart-leave-to-class {
  background-color: red;
  transform: rotate(-360deg) translate3d(-100%, -100%, 0);
}
  </style>
  <link rel="stylesheet" href="./smart-common.css">
</head>
<body>
  <main class="demo-page">
    <header class="demo-header"><h1>Transition 动画</h1><a href="./home.html">Home</a></header>
<section class="demo-block demo-block--padding"><h2>基础用法</h2><div class="demo-block__content">
  <smart-cell title="Fade" bind:click="onClickFade" is-link></smart-cell>
  <smart-cell title="Fade Up" bind:click="onClickFadeUp" is-link></smart-cell>
  <smart-cell title="Fade Down" bind:click="onClickFadeDown" is-link></smart-cell>
  <smart-cell title="Fade Left" bind:click="onClickFadeLeft" is-link></smart-cell>
  <smart-cell title="Fade Right" bind:click="onClickFadeRight" is-link></smart-cell>
  <smart-cell title="Slide Up" bind:click="onClickSlideUp" is-link></smart-cell>
  <smart-cell title="Slide Down" bind:click="onClickSlideDown" is-link></smart-cell>
  <smart-cell title="Slide Left" bind:click="onClickSlideLeft" is-link></smart-cell>
  <smart-cell title="Slide Right" bind:click="onClickSlideRight" is-link></smart-cell>
  <smart-cell title="Custom" bind:click="onClickCustom" is-link></smart-cell>

  <smart-transition
    id="transition-basic"
    name="fade"
    show="false"
    custom-class="block"></smart-transition>

  <smart-transition
    id="transition-custom"
    show="false"
    name=""
    duration="{&quot;enter&quot;:300,&quot;leave&quot;:1000}"
    custom-class="block"
    enter-class="smart-enter-class"
    enter-active-class="smart-enter-active-class"
    leave-active-class="smart-leave-active-class"
    leave-to-class="smart-leave-to-class"
    bind:before-enter="onBeforeEnter"
    bind:enter="onEnter"
    bind:after-enter="onAfterEnter"
    bind:before-leave="onBeforeLeave"
    bind:leave="onLeave"
    bind:after-leave="onAfterLeave"></smart-transition>
</div></section>

  </main>
<script>window.__demoState={
  "show": false,
  "name": "fade",
  "showCustom": false
};window.__handlerMaps={
  "toggle": {},
  "setTrue": {},
  "setFalse": {}
};function __evalDemo(expr){try{return Function('state','computed','with(state){return ('+expr+')}')(window.__demoState,{pad:n=>String(n).padStart(2,'0'),formatDate(v){const d=new Date(Array.isArray(v)?v[0]:v);return Number.isNaN(d.getTime())?'':d.getFullYear()+'-'+this.pad(d.getMonth()+1)+'-'+this.pad(d.getDate())},formatFullDate(v){return this.formatDate(v)},formatRange(v){return Array.isArray(v)?v.map(x=>this.formatDate(x)).filter(Boolean).join(' ~ '):this.formatDate(v)}})}catch(e){return''}}function __attrValue(v){return v==null?'':typeof v==='object'?JSON.stringify(v):String(v)}function __applyBindings(){document.querySelectorAll('*').forEach(el=>{Array.from(el.attributes).forEach(a=>{if(!a.name.startsWith('data-bind-'))return;const real=a.name.slice(10),v=__evalDemo(a.value); if(typeof v==='boolean')el.setAttribute(real,String(v)); else if(v==null||v==='')el.removeAttribute(real); else el.setAttribute(real,__attrValue(v)); if(typeof v==='function'||Array.isArray(v)||(v!=null&&Object.getPrototypeOf(v)===Object.prototype)){const prop=real.replace(/-([a-z])/g,(_,c)=>c.toUpperCase());try{if(prop in el)el[prop]=v}catch(e){}}})})}function __path(p){if(!p)return null;const parts=String(p).split('.');let o=window.__demoState;for(let i=0;i<parts.length-1;i++){if(!o[parts[i]])o[parts[i]]={};o=o[parts[i]]}return [o,parts[parts.length-1]]}function __set(p,v){const r=__path(p);if(!r)return false;r[0][r[1]]=v;__applyBindings();return true}function __toggle(p){const r=__path(p);if(!r)return false;r[0][r[1]]=!r[0][r[1]];__applyBindings();return true}function __getTransitionInstance(id){const host=document.getElementById(id);const runtime=host&&window.MpComponent.resolveRuntimeFromHost(host);return runtime&&runtime.instance}function __triggerTransition(name){const instance=__getTransitionInstance('transition-basic');if(!instance)return false;instance.setData({name,show:true});clearTimeout(window.__transitionTimer);window.__transitionTimer=setTimeout(()=>instance.setData({show:false}),500);return true}function __handle(h,e,el){const transitionNames={onClickFade:'fade',onClickFadeUp:'fade-up',onClickFadeDown:'fade-down',onClickFadeLeft:'fade-left',onClickFadeRight:'fade-right',onClickSlideUp:'slide-up',onClickSlideDown:'slide-down',onClickSlideLeft:'slide-left',onClickSlideRight:'slide-right'};if(transitionNames[h])return __triggerTransition(transitionNames[h]);if(h==='onClickCustom'){const instance=__getTransitionInstance('transition-custom');if(!instance)return false;instance.setData({show:true});clearTimeout(window.__transitionCustomTimer);window.__transitionCustomTimer=setTimeout(()=>instance.setData({show:false}),1000);return true}const m=window.__handlerMaps||{toggle:{},setTrue:{},setFalse:{}};if(m.toggle&&m.toggle[h])return __toggle(m.toggle[h]);if(h==='onClick'&&el.dataset&&el.dataset.stateKey)return __set(el.dataset.stateKey+'.show',true);if(h==='onClose'&&el.dataset&&el.dataset.stateKey)return __set(el.dataset.stateKey+'.show',false);if(m.setTrue&&m.setTrue[h])return __set(m.setTrue[h],true);if(m.setFalse&&m.setFalse[h])return __set(m.setFalse[h],false);if(/toggle|show|open|close/i.test(h)){const s=el.closest('.demo-block')||document,t=s.querySelector('[data-bind-show]')||el.closest('[data-bind-show]');if(t)return __toggle(t.getAttribute('data-bind-show'))}if(/confirm|cancel|close/i.test(h)){const t=el.closest('[data-bind-show]')||el;if(t&&t.getAttribute('data-bind-show'))return __set(t.getAttribute('data-bind-show'),false)}if(/change|input/i.test(h)&&e&&e.detail!=null){const t=el.getAttribute('data-bind-value')||el.getAttribute('data-bind-checked')||el.getAttribute('data-bind-active-index');if(t)return __set(t,e.detail&&e.detail.value!==undefined?e.detail.value:e.detail)}return false}function onBeforeEnter(){console.log('before enter')}function onEnter(){console.log('enter')}function onAfterEnter(){console.log('after enter')}function onBeforeLeave(){console.log('before leave')}function onLeave(){console.log('leave')}function onAfterLeave(){console.log('after leave')}document.addEventListener('DOMContentLoaded', __applyBindings);</script>
</body>
</html>
