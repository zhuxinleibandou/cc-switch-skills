<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Range Slider 双滑块 - WC Demo</title>
  <script src="./wc-dist/builtin-components/dist/next.js"></script>
  <script src="./wc-dist/runtime/index.js"></script>
  <script src="./wc-dist/smart-ui-wc.js"></script>
  <script src="./demo-runtime.js"></script>
  <link rel="stylesheet" href="./smart-common.css">
  <style>
    :root{--app-B1:#fff;--app-B1-N1:#1f2329;--app-B3:#f6f7fb;--app-M1:#3678e3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--app-B3);color:var(--app-B1-N1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .demo-page{width:min(100%,760px);margin:0 auto;padding:24px 16px 48px}
    .demo-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .demo-header h1{margin:0;font-size:24px;line-height:32px}
    .demo-header a{color:#3678e3;text-decoration:none;font-size:14px}
    .demo-block{margin:0 0 28px}
    .demo-block h2{margin:0 0 14px 8px;color:#646566;font-size:14px;font-weight:500}
    .demo-block__content{padding:18px 16px;background:#fff;border-radius:8px}
    smart-range-slider{display:block;margin:18px 4px}
    .vertical-wrap{height:220px;display:flex;align-items:center;gap:20px}
    .log{min-height:64px;margin-top:16px;padding:10px 12px;border-radius:6px;background:#f7f8fa;color:#646566;font-size:12px;line-height:18px;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="demo-page">
    <header class="demo-header"><h1>Range Slider 双滑块</h1><a href="./home.html">Home</a></header>

    <section class="demo-block">
      <h2>双滑块</h2>
      <div class="demo-block__content">
        <smart-range-slider id="range" min="0" max="100" value="[10,40]" bar-height="4px" inactive-color="#D8D9DC" active-color="#007AFF" bind:drag-start="logRangeEvent" bind:drag="logRangeEvent" bind:change="logRangeEvent" bind:drag-end="logRangeEvent"></smart-range-slider>
      </div>
    </section>

    <section class="demo-block">
      <h2>单值模式</h2>
      <div class="demo-block__content">
        <smart-range-slider range="false" min="0" max="100" step="5" value="50" bar-height="6px" bind:drag-start="logRangeEvent" bind:drag="logRangeEvent" bind:change="logRangeEvent" bind:drag-end="logRangeEvent"></smart-range-slider>
      </div>
    </section>

    <section class="demo-block">
      <h2>竖向</h2>
      <div class="demo-block__content vertical-wrap">
        <smart-range-slider vertical min="0" max="100" value="[25,75]" bar-height="8px" active-color="#2dda86" bind:drag-start="logRangeEvent" bind:drag="logRangeEvent" bind:change="logRangeEvent" bind:drag-end="logRangeEvent"></smart-range-slider>
        <smart-range-slider vertical range="false" min="0" max="100" value="45" bar-height="8px" active-color="#ff8f1f" bind:drag-start="logRangeEvent" bind:drag="logRangeEvent" bind:change="logRangeEvent" bind:drag-end="logRangeEvent"></smart-range-slider>
      </div>
    </section>

    <section class="demo-block">
      <h2>禁用状态</h2>
      <div class="demo-block__content">
        <smart-range-slider disabled min="0" max="100" value="[20,80]" bind:drag-start="logRangeEvent" bind:drag="logRangeEvent" bind:change="logRangeEvent" bind:drag-end="logRangeEvent"></smart-range-slider>
      </div>
    </section>

    <section class="demo-block">
      <h2>事件日志</h2>
      <div class="demo-block__content">
        <div id="log" class="log"></div>
      </div>
    </section>
  </main>
  <script>
    const log = document.getElementById('log');
    const rangeSliders = Array.from(document.querySelectorAll('smart-range-slider'));

    function logRangeEvent(detail, event, type) {
      const index = rangeSliders.indexOf(event.target);
      log.textContent = `#${index + 1} ${type}: ${JSON.stringify(detail)}\n` + log.textContent;
    }
  </script>
</body>
</html>
